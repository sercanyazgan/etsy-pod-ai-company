name: Etsy Yapay Zeka Sirketi Gunluk Calisma
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  run-company:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları indir
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yukle
        run: |
          pip install -r requirements.txt

      - name: Şirketi Çalıştır
        run: python main.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Raporu Ekrana Kilitle
        run: bash ekrana_yaz.sh
