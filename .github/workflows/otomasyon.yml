name: Etsy Yapay Zeka Sirketi Gunluk Calisma
on:
  schedule:
    - cron: '0 9 * * *' # Her sabah Türkiye saati ile sabah 12:00 civarı tetiklenir
  workflow_dispatch: # İstediğiniz zaman elle de başlatabilmeniz için buton ekler

jobs:
  run-company:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları indir
        uses: actions/checkout@v3

      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yukle
        run: |
          pip install -r requirements.txt

      - name: Şirketi Çalıştır
        run: python main.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
